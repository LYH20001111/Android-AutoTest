plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 28

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 22
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        newland {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file('newland_debug.keystore')
            storePassword 'android'
        }
    }

    signingConfigs {
        newland {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file('newland_debug.keystore')
            storePassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.newland
            signingConfig signingConfigs.newland
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.newland
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    android.applicationVariants.all {variant ->
        variant.outputs.all {
            def demo = "MESDK-SIMPLE-DEMO"
            def versionName = "_V" + defaultConfig.versionName
            def apkName =  demo + "_"+ variant.buildType.name + versionName
            outputFileName = apkName + "_" + releaseTime()+".apk"
        }
    }
    lintOptions {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.*'], dir: 'libs')
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
}

def static releaseTime() {
    return new Date().format("yyyyMMddHHmm", TimeZone.getTimeZone("GMT+08:00"))
}