plugins {
    id 'com.android.library'
    id 'maven-publish'
}

def appVersionCode = 45
def appVersionName = '1.0.45'


android {
    namespace 'com.hudou.autotest'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode 1
        versionCode = appVersionCode
        versionName = appVersionName
        buildConfigField 'String', 'Author', '"LiuYiHong"'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }//打包aar时，protected权限的方法自动变为了public。
        // 这是因为proguard-android-optimize.txt配置-allowaccessmodification，这项配置的作用是“是否允许改变作用域
        //而proguard-android.txt中没有-allowaccessmodification 配置
        debug {
            minifyEnabled false
        }
    }
    android.libraryVariants.all{
        variant -> variant.outputs.all {
            if("debug" == variant.buildType.name){
                outputFileName = "hudou-autotest-" + defaultConfig.versionName + "-" + variant.buildType.name + ".aar"
            }else {
                outputFileName = "hudou-autotest-" + defaultConfig.versionName + ".aar"
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets{
        main{
            jniLibs.srcDirs = ['src/main/jniLibs', 'libs']
            resources.srcDirs = ['src/main/properties']
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.findByName("release") // 显式查找 release 组件
                groupId = 'com.github.LYH20001111'
                artifactId = 'Android-AutoTest'
                version = '1.0.4'
            }
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-runtime:2.8.8'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    annotationProcessor 'com.google.auto.service:auto-service:1.0.1'
    implementation 'com.google.auto.service:auto-service-annotations:1.0.1'
    implementation 'com.alibaba:fastjson:1.2.75'
    implementation 'com.google.code.gson:gson:2.8.6'

    implementation 'androidx.recyclerview:recyclerview:1.3.0'

    implementation 'org.reflections:reflections:0.9.10'
    implementation 'org.slf4j:slf4j-api:1.7.30'
    implementation 'commons-cli:commons-cli:1.4'

    api 'net.sourceforge.jexcelapi:jxl:2.6.12' //将该依赖的jar导入到libs，和项目一并打包为aar
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.0.0"


}

configurations.all {
    resolutionStrategy {
        force 'com.google.guava:guava:18.0'
        exclude group: 'com.google.guava', module: 'listenablefuture'
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'com.google.code.findbugs', module: 'annotations'
    }
}

task assembleAutoTest {
    def outputDir = new File(project.buildDir, "outputs/aar")
    if (outputDir.exists()) {
        outputDir.listFiles().each { file ->
            if (file.name.endsWith('.aar')) {
                file.delete()
            }
        }
    }
    dependsOn project(':auto-test').tasks.matching { task ->
        task.name.contains('assemble') && (task.name.contains('Release') || task.name.contains('Debug'))
    }
}