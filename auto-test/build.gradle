plugins {
    id 'com.android.library'
    id "com.vanniktech.maven.publish" version "0.34.0"
    id 'signing'
}

def appVersionCode = rootProject.ext.autotestVersionCode
def appVersionName = rootProject.ext.autotestVersionName

android {
    namespace 'com.hudou.autotest'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode = appVersionCode
        versionName = appVersionName

        buildConfigField 'String', 'AUTHOR', '"Liu YiHong"'
        buildConfigField 'String', 'STRUCTURE_VERSION', "\"" + appVersionName + "\""

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs', 'libs']
            resources.srcDirs = ['src/main/properties']
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
}

dependencies {
    // AndroidX 核心和 UI 组件
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.navigation:navigation-runtime:2.8.8'
    implementation 'androidx.core:core-splashscreen:1.0.0'
    
    // RecyclerView
    api 'androidx.recyclerview:recyclerview:1.3.1'
    
    // ViewPager
    implementation 'androidx.viewpager:viewpager:1.0.0'
    
    // Room 数据库
    def room_version = "2.6.1"
    api "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-common:$room_version"
    
    // 日志和工具库
    implementation 'org.slf4j:slf4j-api:1.7.30'
    implementation 'commons-cli:commons-cli:1.4'
    implementation 'org.reflections:reflections:0.10.2'
    
    // JSON 解析
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // Excel 支持 (libs 目录下的 jar)
    api 'net.sourceforge.jexcelapi:jxl:2.6.12'
    
    // SwipeRefreshLayout
    api 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // Lifecycle 和 LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    
    // 测试依赖
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

configurations.all {
    exclude group: 'com.google.guava', module: 'listenablefuture'
}

signing {
    // Temporarily disabled for testing - re-enable when GPG is configured
    // Use conditional signing based on key availability
    def gpgKeyId = System.getenv('ORG_GRADLE_PROJECT_signingKey') ?: System.getProperty('signingKey')
    def gpgPassphrase = System.getenv('ORG_GRADLE_PROJECT_signingPassword') ?: System.getProperty('signingPassword')
    
    if (gpgKeyId && gpgPassphrase) {
        // Use in-memory keys for CI/CD environment
        useInMemoryPgpKeys(gpgKeyId, gpgPassphrase)
        println "✓ Using in-memory GPG keys for signing"
        sign publishing.publications
    } else {
        println "ℹ Skipping signing - no GPG keys configured"
    }
}

// Configure Maven Publishing with VannikTech plugin (v0.34.0)
mavenPublishing {
    // Coordinates can be specified here or automatically derived from plugin configuration
    coordinates(
            'com.github.LYH20001111',
            'Android-AutoTest',
            appVersionName
    )

    pom {
        name = 'Android AutoTest'
        description = 'Android automated test framework'
        url = 'https://github.com/LYH20001111/Android-AutoTest'

        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }

        developers {
            developer {
                id = 'LYH20001111'
                name = 'Liu YiHong'
                email = '171115368@qq.com'
            }
        }

        scm {
            connection = 'scm:git:git://github.com/LYH20001111/Android-AutoTest.git'
            developerConnection = 'scm:git:ssh://git@github.com/LYH20001111/Android-AutoTest.git'
            url = 'https://github.com/LYH20001111/Android-AutoTest'
        }
    }
}

// Override repository for local publishing to system Maven repo
afterEvaluate {
    publishing {
        repositories {
            // Use the actual Windows user profile directory instead of $HOME
            maven {
                name = 'systemMavenLocal'
                def userProfile = System.getenv('USERPROFILE') ?: System.getProperty('user.home')
                url = uri("${userProfile}/.m2/repository")
                println "📦 Publishing to: ${url}"
            }
        }
    }
}