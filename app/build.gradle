plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace "com.hudou.autotest"

    defaultConfig {
        applicationId "com.hudou.autotest"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding = true
    }//必须加
}

dependencies {
    implementation "com.github.LYH20001111:Android-AutoTest:${rootProject.ext.autotestVersionName}"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // app 自有功能依赖（扫码、Excel OOXML、动画），不属于 auto-test
    implementation 'com.google.zxing:core:3.4.0'
    implementation('com.journeyapps:zxing-android-embedded:4.2.0') {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
    implementation 'org.apache.poi:poi:3.16'
    implementation('org.apache.poi:poi-ooxml:3.16') {
        exclude group: 'org.apache.xmlbeans', module: 'xmlbeans'
    }
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation('com.airbnb.android:lottie:5.2.0') {
        exclude group: 'com.google.guava', module: 'listenablefuture'
    }
}