plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace "com.hudou.autotest"

    defaultConfig {
        applicationId "com.hudou.autotest"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding = true
    }//必须加
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    //必须加
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'net.sourceforge.jexcelapi:jxl:2.6.12'
    def room_version = "2.5.2" // 推荐使用最新稳定版本
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"
    api 'net.sourceforge.jexcelapi:jxl:2.6.12'
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.0.0"
    implementation 'com.google.zxing:core:3.4.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.2.0'
    implementation 'org.apache.poi:poi:3.16'
    implementation('org.apache.poi:poi-ooxml:3.16') {
        exclude group: 'org.apache.xmlbeans', module: 'xmlbeans'
    }
    implementation 'org.apache.commons:commons-lang3:3.12.0'

//    implementation project(':local-repo:auto-test')

    implementation 'com.airbnb.android:lottie:5.2.0'
}